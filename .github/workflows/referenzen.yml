name: Referenzen-Vorschauen erzeugen

# Wandelt neue oder geänderte Dateien im Ordner referenzen auf dem Webspace um
# (Druck-PDFs, Präsentationen, Videos, große Bilder) und legt die Vorschauen daneben ab.
# Läuft jede Nacht und auf Knopfdruck (Actions > Referenzen-Vorschauen erzeugen > Run workflow).
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      baum:
        description: 'Ordnerbaum zeigen für Kunden mit diesem Namensteil (leer = nicht zeigen)'
        required: false
        default: ''

concurrency:
  group: referenzen
  cancel-in-progress: false

jobs:
  vorschauen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Python-Bausteine installieren
        run: pip install --quiet paramiko pillow || pip install --quiet paramiko pillow

      - name: Prüfen, ob PDFs, Videos oder Präsentationen neu sind
        id: bedarf
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PATH: ${{ secrets.SFTP_PATH }}
        run: |
          if [ "$SFTP_PATH" = "/" ] || [ -z "$SFTP_PATH" ]; then echo "::error::SFTP_PATH ungültig"; exit 1; fi
          python3 tools/referenzen_vorschau.py --sftp --pruefen | tee plan.txt
          if grep -iE "^Erzeuge Vorschau: .*\.(pdf|ppt|pptx|odp|mp4|mov|m4v|avi|mkv|wmv|mpg|mpeg)$" plan.txt >/dev/null; then echo "werkzeuge=ja" >> "$GITHUB_OUTPUT"; else echo "werkzeuge=nein" >> "$GITHUB_OUTPUT"; echo "Nur Bilder oder nichts Neues: Programme werden nicht installiert"; fi

      - name: Programme für PDF, Video und Präsentation installieren
        if: steps.bedarf.outputs.werkzeuge == 'ja'
        timeout-minutes: 8
        continue-on-error: true   # hängt der Ubuntu-Paketserver, werden Bilder trotzdem abgeglichen und die Liste aufgefrischt
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y -qq poppler-utils ffmpeg libreoffice-impress --no-install-recommends

      - name: Vorschauen erzeugen
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PATH: ${{ secrets.SFTP_PATH }}
          BAUM: ${{ github.event.inputs.baum }}
        run: |
          if [ "$SFTP_PATH" = "/" ] || [ -z "$SFTP_PATH" ]; then echo "::error::SFTP_PATH ungültig"; exit 1; fi
          python3 tools/referenzen_vorschau.py --sftp --baum "$BAUM"

      - name: Referenzliste auf der Website auffrischen
        if: always()
        run: |
          curl -fsS -o api.json "https://capeeshee.com/referenzen/api.php?neu=1" || { echo "::warning::Auffrischen nicht möglich"; exit 0; }
          python3 -c "import json;d=json.load(open('api.json'));[print(k['name'],'| Bereiche:',[b['name']+'('+str(len(b['arbeiten']))+')' for b in k['bereiche']],'| Kachelbilder:',len(k['kachel'])) for k in d['kunden']]"
